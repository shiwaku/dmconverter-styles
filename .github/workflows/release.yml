# v* のタグを push すると、styles/ をまとめた ZIP を添付したリリースを作る
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP を作る
        run: |
          name="dmconverter-styles-${GITHUB_REF_NAME}"
          mkdir -p "dist/${name}"
          cp -r styles LICENSE README.md "dist/${name}/"
          cp icons/LICENSE "dist/${name}/LICENSE-dm-sprite"
          (cd dist && zip -r "${name}.zip" "${name}")
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/dmconverter-styles-${GITHUB_REF_NAME}.zip" --generate-notes
